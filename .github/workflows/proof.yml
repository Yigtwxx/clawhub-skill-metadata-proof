name: Skill Catalog Metadata Proof

# Both jobs hardcode dry_run: true and pass no secrets, so this workflow can
# never publish. It pins the ClawHub branch by full commit SHA.

on:
  workflow_dispatch:

permissions: {}

jobs:
  with-metadata:
    permissions:
      contents: read
      id-token: write
    uses: Yigtwxx/clawhub/.github/workflows/skill-publish.yml@d4c222180958011e7344414078bdb1c53ffad217
    with:
      dry_run: true
      skill_path: skills/metadata-proof-skill
      changelog: "Proof run: metadata reaches the CLI; quotes and ; stay intact."
      categories: "automation"
      topics: "code-review,linting"

  without-metadata:
    permissions:
      contents: read
      id-token: write
    uses: Yigtwxx/clawhub/.github/workflows/skill-publish.yml@d4c222180958011e7344414078bdb1c53ffad217
    with:
      dry_run: true
      skill_path: skills/metadata-proof-skill
