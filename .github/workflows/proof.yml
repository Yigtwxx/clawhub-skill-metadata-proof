name: Skill Catalog Metadata Proof

# Every job hardcodes dry_run: true and passes no secrets, so this workflow can
# never publish. It pins the ClawHub branch by full commit SHA.

on:
  workflow_dispatch:

permissions: {}

jobs:
  with-metadata:
    permissions:
      contents: read
      id-token: write
    uses: Yigtwxx/clawhub/.github/workflows/skill-publish.yml@ade5dc4268c352c267db0a4fbbd0c2143a848988
    with:
      dry_run: true
      skill_path: skills/metadata-proof-skill
      changelog: "Proof run: metadata reaches the CLI; quotes and ; stay intact."
      categories: "automation"
      topics: "code-review,linting"

  without-metadata:
    permissions:
      contents: read
      id-token: write
    uses: Yigtwxx/clawhub/.github/workflows/skill-publish.yml@ade5dc4268c352c267db0a4fbbd0c2143a848988
    with:
      dry_run: true
      skill_path: skills/metadata-proof-skill

  clear-both:
    permissions:
      contents: read
      id-token: write
    uses: Yigtwxx/clawhub/.github/workflows/skill-publish.yml@ade5dc4268c352c267db0a4fbbd0c2143a848988
    with:
      dry_run: true
      skill_path: skills/metadata-proof-skill
      clear_categories: true
      clear_topics: true

  set-one-clear-other:
    permissions:
      contents: read
      id-token: write
    uses: Yigtwxx/clawhub/.github/workflows/skill-publish.yml@ade5dc4268c352c267db0a4fbbd0c2143a848988
    with:
      dry_run: true
      skill_path: skills/metadata-proof-skill
      categories: "automation"
      clear_topics: true
